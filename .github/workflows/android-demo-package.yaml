name: android-demo-package

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-demo-v*'

permissions:
  contents: read

jobs:
  package:
    uses: steinshei/platform-cicd/.github/workflows/reusable-android-package.yml@v1.8
    with:
      project_dir: apps/android-demo
      java_version: '17'
      package_tasks: ':app:assembleRelease :app:bundleRelease'
      artifact_name: android-demo-release
      retention_days: 14
