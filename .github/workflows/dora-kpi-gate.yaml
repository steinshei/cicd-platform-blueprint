name: dora-kpi-gate

on:
  workflow_dispatch:
    inputs:
      days:
        description: Window in days
        required: false
        default: "7"
      max_cfr:
        description: Max Change Failure Rate (%)
        required: false
        default: "15"
      max_mttr_hours:
        description: Max MTTR in hours
        required: false
        default: "0.5"
  schedule:
    - cron: "30 2 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  kpi-gate:
    uses: steinshei/platform-cicd/.github/workflows/reusable-dora-kpi-gate.yml@v1.9.1
    with:
      window_days: ${{ github.event.inputs.days || '7' }}
      max_cfr: ${{ github.event.inputs.max_cfr || '15' }}
      max_mttr_hours: ${{ github.event.inputs.max_mttr_hours || '0.5' }}
      artifact_name: dora-kpi-gate
