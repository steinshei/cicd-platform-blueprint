name: android-demo-package-signed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and AAB
        working-directory: apps/android-demo
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Sign release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: apps/android-demo/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed APK and release bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-demo-signed-release-${{ github.run_number }}
          retention-days: 14
          path: |
            ${{ steps.sign_apk.outputs.signedReleaseFile }}
            apps/android-demo/app/build/outputs/bundle/release/*.aab
