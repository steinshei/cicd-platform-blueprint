name: dora-weekly-report

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Window in days
        required: false
        default: "7"

permissions:
  actions: read
  contents: read

jobs:
  report:
    uses: steinshei/platform-cicd/.github/workflows/reusable-dora-report.yml@v1.9
    with:
      window_days: ${{ github.event.inputs.days || '7' }}
      artifact_name: dora-weekly-report
