name: android-demo-ci

on:
  pull_request:
    branches: [develop, main, 'release/**']
    paths:
      - apps/android-demo/**
      - .github/workflows/android-demo-baseline-profile.yaml
      - .github/workflows/reusable-android-macrobenchmark-self-hosted.yml
  push:
    branches: [develop, main, 'release/**']
    paths:
      - apps/android-demo/**
      - .github/workflows/android-demo-baseline-profile.yaml
      - .github/workflows/reusable-android-macrobenchmark-self-hosted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run unit tests (cloud)
        working-directory: apps/android-demo
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :benchmark:assembleBenchmarkBenchmark :app:testDebugUnitTest --no-daemon

  local-macrobenchmark:
    needs: [cloud-gate]
    uses: ./.github/workflows/reusable-android-macrobenchmark-self-hosted.yml
    with:
      project_dir: apps/android-demo
      java_version: '17'
      benchmark_module: benchmark
      benchmark_task: connectedCheck
      # Adjust labels to match your self-hosted runner registration.
      # For macOS Apple Silicon self-hosted runner, this is usually:
      # ["self-hosted","macOS","ARM64"]
      runner_labels_json: '["self-hosted","macOS","ARM64"]'
