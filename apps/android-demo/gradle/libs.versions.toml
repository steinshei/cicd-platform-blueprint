[versions]
agp = "8.6.1"
kotlin = "2.0.21"
androidx-baselineprofile = "1.3.0"
profileinstaller = "1.3.1"
macrobenchmark = "1.2.4"
uiautomator = "2.3.0"
android-test-runner = "1.6.2"

[libraries]
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
macrobenchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "macrobenchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-baselineprofile" }
